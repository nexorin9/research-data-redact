# 科研影像数据脱敏系统 · 策略表（骨架）
#
# 本文件是识别层与策略层的唯一配置真源：
#   1. thresholds   —— 全局阈值与逐识别器阈值
#   2. entities     —— 实体类别 → 处置动作（replace / redact / keep / hmac_pseudonym）
#   3. allow_list   —— 白名单（exact / regex 两种匹配）
#   4. context      —— 邻近窗口上下文词表与加分系数
#
# Task 1 只落结构与注释条目；实体清单、白名单条目由后续任务补齐。
# Task 4 起补齐「编号 / 联系方式形态约束」（第 7、8 节）—— 识别器的位数、前缀、
# 字符集与基础分数全部从本文件读，代码里不写死。
# Task 27 起补齐第 13 节「DICOM tag 级去标识」—— 保留 / 清空 / 替换三类处置
# 与私有 tag 一律清空的口径同样从本文件读。
# Task 28 起补齐第 14 节「残留自检分级口径」—— 哪些档位拦住这一批、哪些只
# 提示，同样从本文件读（改 YAML 即改分级）。
# 装配非法（未知识别器名 / 阈值越界 / 处置动作未知 / 形态约束非法 / DICOM 处置
# 冲突 / 分级档位未知或重复分派 / YAML 结构错）必须报错，不静默取默认值。

version: 1

# ---------------------------------------------------------------------------
# 1. 阈值
# ---------------------------------------------------------------------------
thresholds:
  # 全局阈值：低于该分数的命中降为「告警档」，不判为身份，不计入身份类残留统计
  global: 0.5
  # 逐识别器阈值覆盖：同名键覆盖全局阈值
  per_recognizer: {}
  # 例：
  #   per_recognizer:
  #     visit_no: 0.6
  #     id_card: 0.8

# ---------------------------------------------------------------------------
# 2. 识别器名册（启停）
#
#    这里是「谁在跑」的开关，不是文档说明：
#      enabled: false 的识别器**根本不注册**，一条命中都不会产出 ——
#      不是「产出了再过滤掉」。科室反馈某个识别器误伤多、临时关掉，
#      改这里即可，不必改代码。
#
#    名字写错会直接报错，不会被静默忽略（「以为关了某识别器、实际还在跑」
#    是漏脱事故里最难查的一种）。没出现在这里的识别器默认启用。
#
#    逐识别器的门槛覆盖写在上面 thresholds.per_recognizer —— 两处各管一件事：
#    这里管「跑不跑」，那里管「多高才算数」。
# ---------------------------------------------------------------------------
recognizers:
  # 字段标签驱动形态：「姓名：X」「住院号：Y」这类带标签的取值
  labeled_field:
    enabled: true
  patient_index:
    enabled: true
    # 姓名与就诊号之间允许的最大间隔（字符数）：超过就不算同一条记录，
    # 姓名降为告警档。报告里「姓名：X 住院号：Y」通常只隔三四个字。
    proximity_radius: 24
    # 本识别器判定「确认为身份」的门槛：单独姓名命中必须落在它之下 ——
    # 这是「单独姓名一律降为告警档」的结构性保证，与全局阈值无关。
    confirm_threshold: 0.5
    # 「姓名 + 就诊号」组合命中的分数（确认档）
    composite_score: 0.9
    # 主键命中的分数（确认档，最强的身份证据）
    primary_key_score: 0.95
    # 单独姓名 / 同名歧义命中的分数（告警档：判为身份证据不足）
    name_only_score: 0.3
  id_card:
    enabled: true
    # 校验位通过时的分数（确认档）
    confirm_score: 0.9
    # 校验位不通过 / 出生日期非法时的分数 —— 必须低于 confirm_score，
    # 这样「降为告警档」与全局阈值无关，调全局阈值也不会把反例抬成身份
    invalid_score: 0.2
    # 15 位旧版身份证号（无校验位，无法验证）的分数 —— 必须低于 confirm_score
    legacy_score: 0.2
    # 是否要求出生日期码是合法日历日期（关掉则只看校验位）
    require_valid_birth_date: true
  visit_no:
    enabled: true
  phone_birth:
    enabled: true
  # 邻近窗口上下文加分：不是识别器（不产出命中），只给命中加分，同样在此启停
  context_boost:
    enabled: true

# ---------------------------------------------------------------------------
# 3. 实体类别 → 处置动作
#    replace          替换为固定占位符（必须给 placeholder）
#    redact           整段清空
#    keep             保留原文
#    hmac_pseudonym   一致代号（HMAC-SHA256 over 患者主索引主键）—— task 24 落地
#    hmac_restore     一致代号的还原侧（按代号反查对照索引回填原文）—— task 25 落地
#                     （成对挂载：脱敏侧登记的对照槽位，还原侧才取得到）
#
#    动作名写错、类别没声明动作、replace 没给占位符，策略表装载时一律报错 ——
#    静默降级会让「以为脱过了」与「实际没脱」长期并存。
#    反过来，动作已声明但实现尚未落地时，执行时报「动作未落地」并中止该批，
#    绝不静默退回「保留原文」。
# ---------------------------------------------------------------------------
entities:
  PATIENT_NAME:
    action: replace
    placeholder: "<患者姓名>"
    # 目标处置：一致代号（同一患者跨材料代号恒等）—— 见下面第 12 段的
    # profiles.pseudonym 档位：一致性代号档把本类切到 hmac_pseudonym，
    # 默认档仍用占位符（单份材料即时脱敏，不必配密钥）。
  PATIENT_ID:
    action: replace
    placeholder: "<患者编号>"
  ID_CARD:
    action: redact
  VISIT_NO:
    action: replace
    placeholder: "<住院号>"
  EXAM_NO:
    action: replace
    placeholder: "<检查号>"
  PHONE:
    action: redact
  BIRTH_DATE:
    action: redact
  DEVICE_ID:
    action: keep

# ---------------------------------------------------------------------------
# 4. 白名单（exact / regex）
#    命中白名单的区间一律放行：不替换、不计入残留统计，并在命中清单中记为「已放行」
#
#    白名单是「脱过头」的主防线。剂量 / 金额 / 页码 / 床号由第 6 段的数字类消歧
#    挡掉，但**字段位置上的非身份取值**（表单占位、模板默认值、上游系统占位号）
#    只有白名单能挡 —— 它们长得很像要脱的内容，脱掉之后临床数据就失真了，
#    科室回头一看「姓名：<患者姓名>」根本没法用。
#
#    放行三条原则：
#      1. 只放行**确定不是患者身份**的取值。放行项在命中清单里可见（人工抽检
#         时看得见「这一处为什么没脱」），但不计入残留统计。
#      2. exact 写**完整取值**，regex 写**形态**；regex 必须窄到不与本院真
#         编号形态重叠 —— 形态写宽了会连真住院号一起放过（漏脱比脱过头更糟）。
#      3. 各院区编码习惯不同，改这里即可，不必改代码。
# ---------------------------------------------------------------------------
allow_list:
  exact:
    # 姓名 / 受检者姓名字段上的**非人名取值**：入院时姓名未定的占位、
    # 新生儿病人的模板默认值、代填「本人」等。脱掉它们只会让材料没法用。
    - "未登记"
    - "待补"
    - "待填"
    - "本人"
    - "新生儿"
    - "匿名"
    - "已故"
    - "不详"
    - "无名氏"
    - "同上"
  regex:
    # 1) 上游系统导出时的英文占位值（住院号 / 检查号未分配时写这些）
    - "^(?:NONE|NULL|NIL|PENDING|TODO|UNKNOWN|UNSET|NOT_?SET|N/?A)$"
    # 2) 全零占位号（上游写 0000000 / MZ000000 表示还没分配）
    - "^(?:[A-Z]{1,3})?0{4,12}$"
    # 3) 上游已打码的编号（XXXXXXXX）
    - "^X{4,16}$"
    # 4) 本院检验申请单里的**检验项目编码**：JC + 10 位数字。
    #    检查号是 JC + 6–9 位（或 CHK / EX 前缀），按位数区分。
    #    换院区编码规则不同就把这条改掉或删掉 —— 写宽了会放过真检查号。
    - "^JC\\d{10}$"

# ---------------------------------------------------------------------------
# 5. 邻近窗口上下文
#    字符 n-gram 邻近窗口打分（窗口内命中上下文词则提分，窗口外绝不加分）
#
#    window_radius  邻近窗口半径：命中区间前后各取多少个字符（默认 24）
#    ngram_sizes    字符 n-gram 长度（2 = 双字，3 = 三字），可配
#    base_weight    加分系数：加分 = base_weight × 相似度
#    max_boost      单次加分上限
#    terms          上下文词表 —— 各院区写法不同，改这里即可，不必改代码
#
#    相似度算法：Dice 系数 2|A∩B| / (|A|+|B|)，配「局部最佳对齐」——
#    先用词的 n-gram 锚点在窗口里定位候选位置，再对每段等长片段算 Dice 取最大值。
#    词原样出现即 1.0，被空格或错字打断则按公共 n-gram 比例下降，窗口外恒为 0。
#    不用整窗直接算 Dice：窗口几十个字符会把原样出现的词稀释掉，
#    同一份材料换个窗口半径结论就变。
#
#    加分封顶在生效阈值上：只把「告警档」抬成「确认档」，不越过门槛。
#    加分只升档，不改实体类别 —— 上下文词补充证据，不改写识别器的判定。
#    词表里出现的词是公共词表，不是患者数据，可原样写进命中清单解释。
# ---------------------------------------------------------------------------
context:
  window_radius: 24
  ngram_sizes: [2, 3]
  base_weight: 0.2
  max_boost: 0.2
  terms:
    - "患者"
    - "病人"
    - "受检者"
    - "姓名"
    - "住院号"
    - "门诊号"
    - "检查号"
    - "病案号"
    - "证件号"
    - "身份证"
    - "出生日期"
    - "性别"
    - "年龄"

# ---------------------------------------------------------------------------
# 6. 数字类歧义消解（剂量 / 金额 / 页码 / 床号不得判为身份）
#
#    识别器在「数字候选」这一步先过本段判定，不构成身份候选的压根不进命中列表。
#
#    dose_units       紧邻的数字判为剂量（不看位数：金额动辄六七位数，最像住院号）
#    currency_marks   紧邻的数字判为金额
#    page_markers     紧邻的数字判为页码 / 序号（只对 ≤4 位的小数字生效）
#    bed_markers      紧邻的数字判为床号（只对 ≤4 位的小数字生效）
#    date_markers     紧邻的数字判为日期片段；连字符数字串（2026-01-05 三段、
#                     或分段写的复合标识 110101-19491231002）同理
#    sequence_markers 紧邻的数字判为序号
#    require_context  住院号 / 检查号命中须有邻近上下文词，否则降为告警档
#    window           上下文词的邻近窗口半径（命中区间前后各取多少字符）
#    context_terms    编号类上下文词表 —— 各院区写法不同，改这里即可
#
#    short_number_max_digits  页码 / 床号 / 序号只对不超过该位数的数字生效
#                              （超过它就宁可多脱一次，也不能把真住院号当床号放过）
#    composite_min_digits      连字符复合标识另一侧至少要有多少位数字才算一段
#                              （另一侧只有 1–3 位时按序号后缀处理，前一段仍判编号）
# ---------------------------------------------------------------------------
numeric_boundary:
  dose_units: ["mg", "mL", "片", "袋", "IU", "次", "ml"]
  currency_marks: ["元", "￥", "¥"]
  page_markers: ["页", "第"]
  bed_markers: ["床"]
  date_markers: ["年", "月", "日"]
  sequence_markers: ["序号"]
  # 住院号 / 检查号命中须有邻近上下文词命中，否则降为告警档
  require_context: true
  window: 16
  short_number_max_digits: 4
  composite_min_digits: 4
  context_terms:
    - "住院号"
    - "住院流水号"
    - "病案号"
    - "病历号"
    - "门诊号"
    - "就诊号"
    - "检查号"
    - "检查流水号"
    - "申请号"
    - "登记号"
    - "住院"
    - "就诊"
    - "检查"
    - "患者"
    - "病人"
    - "受检者"

# ---------------------------------------------------------------------------
# 7. 编号形态约束（位数 / 前缀 / 字符集）—— 正则形态识别器的形状从本节读
#    不同医院的住院号位数与前缀写法不同，改这里即可，不必改代码。
#    digit_length 指「前缀之后的数字本体长度」；prefixes 为允许的前缀写法；
#    require_prefix 为真时前缀必须出现（否则该形态只认带前缀的编号）；
#    allow_alphanumeric 为真时数字本体允许混入字母（如 PACS 申请号）。
# ---------------------------------------------------------------------------
number_shapes:
  visit_no:
    enabled: true
    label_zh: 住院号
    entity: VISIT_NO
    score: 0.7
    digit_length: [6, 10]
    prefixes: []
    require_prefix: false
    allow_alphanumeric: false
  outpatient_no:
    enabled: true
    label_zh: 门诊号
    entity: VISIT_NO
    score: 0.7
    digit_length: [6, 10]
    prefixes: ["MZ"]
    require_prefix: true
    allow_alphanumeric: false
  exam_no:
    enabled: true
    label_zh: 检查号
    entity: EXAM_NO
    score: 0.7
    digit_length: [6, 14]
    prefixes: ["CHK", "EX", "JC", "P"]
    require_prefix: true
    allow_alphanumeric: true

# ---------------------------------------------------------------------------
# 8. 联系方式与出生日期形态
#    手机号：prefixes 为号段前缀，length 为总长度；
#    出生日期：separators 为分隔符写法，chinese_format 为真时额外识别
#    「1990年1月2日」；context_terms 为「这条日期确实是出生日期」的邻近语义词，
#    negative_terms 为「这条日期不是出生日期」的排除语义词（报告日期等）。
#    没有任何邻近语义词的裸日期不判为出生日期 —— 报告日期与出生日期同形，
#    硬判必然误伤。
# ---------------------------------------------------------------------------
contact_shapes:
  phone:
    enabled: true
    shape_type: phone
    label_zh: 手机号
    entity: PHONE
    score: 0.75
    length: 11
    prefixes: ["13", "14", "15", "16", "17", "18", "19"]
  birth_date:
    enabled: true
    shape_type: birth_date
    label_zh: 出生日期
    entity: BIRTH_DATE
    score: 0.7
    separators: ["-", "/", "."]
    chinese_format: true
    context_window: 16
    context_terms: ["出生日期", "出生年月", "出生", "生日", "生于"]
    negative_terms: ["报告日期", "检查日期", "检验日期", "入院日期", "出院日期", "手术日期", "送检日期", "采集日期"]

# ---------------------------------------------------------------------------
# 9. 统一裁决（同一段只替换一次）
#    两段命中互相重叠时，只有一段负责改写；被裁掉的一方记入命中清单
#    （实体类别 + 起止位置 + 让位原因，不含命中原文）。
#
#    优先级档位（小 = 优先）：
#      identity   身份类     —— 姓名 / 患者编号 / 身份证 / 手机号 / 出生日期
#      encounter  就诊编号类 —— 住院号 / 门诊号 / 检查号
#      generic    通用数字类 —— 其余实体类别
#
#    四条规则顺序固定（代码在 research_redact/arbitration.py，跨识别器的
#    重叠 / 包含 / 交叉 / 完全重合都在那一处定案）：
#      1. 档位优先 —— 身份类 > 就诊编号类 > 通用数字类；
#      2. 同级比分数 —— 分数高者胜；
#      3. 解释更完整者胜 —— 档位与分数都相同时保留说明更细的一条；
#      4. 同类先合并 —— 同类命中重叠或只隔空白时合成一段。
#
#    第 1 条排在第 2 条前面是刻意的：「分数高」不等于「该优先脱」。
#    住院号识别器 0.99 分压过身份证识别器 0.60 分时，若按分数让位，这一段
#    就按住院号处置，主索引绑定随之丢失，一致代号跨材料就不一致了。
#
#    entities 段声明了实体类别，就必须在 priority 段分配档位 —— 漏分配会让新
#    类别静默落到通用数字类，正是「以为脱干净了、实际没有」的那类事故。
#
#    merge_adjacent_same_label：同类命中之间只隔空白时合并成一段
#    （一次改写覆盖两处，避免两个占位符连在一起）。
# ---------------------------------------------------------------------------
conflicts:
  merge_adjacent_same_label: true
  default_tier: generic
  priority:
    PATIENT_NAME: identity
    PATIENT_ID: identity
    ID_CARD: identity
    PHONE: identity
    BIRTH_DATE: identity
    VISIT_NO: encounter
    EXAM_NO: encounter
    DEVICE_ID: generic

# ---------------------------------------------------------------------------
# 10. 列级策略（结构化材料按列处理）
#
#     申请单（JSON / xlsx）与结构化材料的每一列都有角色，三类：
#
#       business_columns  业务标识与说明列 —— 逐字保留，不识别不脱敏。
#                         申请单号 / 伦理批件号 / 材料 ID / 类型 / 路径 /
#                         材料技术内容列都在这里：交付回执按申请单号与平台
#                         台账对账，脱掉它这一批就「谁都对不上」。
#       bound_columns     患者绑定列 —— 患者主索引主键。身份锚定走 HIS 主
#                         索引读回的权威名单，不由通用正则改写（改写出来的
#                         号对不上主索引，一致代号也就无从谈起）。
#       content_columns   显式划为内容列的列名。为空表示「未列出的列一律
#                         按内容列处理」—— 默认方向是扫描，宁可多脱也不
#                         放过。
#
#     结构性默认列（application_no / ethics_approval_no / material_id /
#     kind / path / material_content / patient_id）永远生效，本段在其之上
#     追加本院特有的列。同一列不得同时出现在两类里 —— 装载时报错。
#
#     医院确实把患者身份粘进了业务列时，把该列写进 content_columns 即可，
#     不必改代码。
# ---------------------------------------------------------------------------
columns:
  business_columns:
    - project_no
    - owner
  bound_columns: []
  content_columns: []

# ---------------------------------------------------------------------------
# 11. 一致代号口径（HMAC-SHA256 over 患者主索引主键）
#
#     scheme         方案名 —— 写进交付体 pseudonymization.scheme，
#                    科研数据平台据此判断这批数据用的是哪套代号口径
#     prefix         代号前缀（代号 = 前缀 + 十六进制摘要）
#     digest_length  摘要截取位数（出厂 16 位）
#
#     密钥从 $PSEUDONYM_HMAC_KEY 读，密钥版本号从 $PSEUDONYM_KEY_ID 读
#     （两者都不写进本文件 —— 策略表里不出现凭据）。缺密钥时报错中止，
#     不降级为无密钥哈希。
#
#     代号的取值输入**只有患者主索引主键**：姓名、住院号、身份证不参与
#     计算，因此不可能出现在代号里。同一患者在不同材料里（姓名处 / 住院号
#     处 / 主键处）拿到的代号恒等，靠的就是这一条。
# ---------------------------------------------------------------------------
pseudonymization:
  scheme: "hmac-sha256"
  prefix: "P-"
  digest_length: 16

# ---------------------------------------------------------------------------
# 12. 档位（profiles）—— 一份策略表装下多套处置口径
#
#     默认档：占位符替换（replace / redact）—— 单份材料即时脱敏，
#             不需要任何密钥，也不依赖 HIS 主索引。
#     一致代号档（pseudonym）：把两个「身份绑定类」切到 hmac_pseudonym ——
#             同一患者跨材料代号恒等、不同主键不串号。交付科研数据平台时用。
#
#     选用方式：export RESEARCH_POLICY_PROFILE=pseudonym
#     档内按键浅合并：档里写了哪个类别就用档里的动作，没写的沿用默认档。
#     档名写错直接报错，不静默退回默认档。
#
#     一致代号档要求**身份锚定**：材料里的姓名 / 主键必须能被 HIS 患者
#     主索引绑定到主键。绑不上时该批中止并报错 —— 不得按姓名硬匹配兜底，
#     也不得退回占位符（那就不是一致代号了）。
# ---------------------------------------------------------------------------
profiles:
  pseudonym:
    description: "一致代号档：交付科研数据平台时启用（需 HIS 患者主索引读回绑定）"
    entities:
      PATIENT_NAME:
        action: hmac_pseudonym
      PATIENT_ID:
        action: hmac_pseudonym

# ---------------------------------------------------------------------------
# 13. DICOM tag 级去标识（影像材料）
#
#     三类处置：
#       keep_tags    保留（值逐字不动）—— 必要 tag：检查号 / 序列号 / 设备信息
#       clear_tags   清空（值置零长度）—— 身份 tag：姓名 / 患者编号 / 出生日期 /
#                    申请医师 / 机构名 …
#       replace_tags 替换（值换成给定取值）—— 例如把患者编号换成一致代号
#
#     clear_private_tags：私有 tag（奇数组）一律清空。厂商私有区的内容不可
#     预知 —— 本院 RIS 导出可能把住院号写进私有 tag，不清掉就等于「按标准
#     清了、实际上没清」。
#
#     default_action：未列入处置表的**标准** tag 的默认动作。
#       keep（出厂）—— 不在表里的不动。适合「标准 tag 都是研究需要的」。
#       clear       —— 白名单口径（PS3.15 Basic Profile 口径）：不在保留表里
#                     的标准 tag 一律清空。更保守，代价是研究可用性下降。
#
#     mark_identity_removed：写入 (0012,0062) PatientIdentityRemoved=YES 与
#     (0012,0063) DeidentificationMethod —— 收件方据此知道这份片子脱过、
#     怎么脱的，不必猜。
#
#     **首版不做像素烧录**：画面角上烧录的姓名 / 住院号属于像素层，本轮不
#     涂除（OCR 依赖重、中文召回不稳）。(0028,0301) BurnedInAnnotation 旗标
#     原样保留，由登记员人工点检 —— 不假装「已涂除」。
#
#     保留项与清空项都进命中清单（tag 号 + 处置 + 字节区间，不记原值），
#     伦理办抽检时看得见「留了什么、为什么留」。
# ---------------------------------------------------------------------------
dicom:
  enabled: true
  keep_tags:
    # 检查号 / 序列号：研究方据此把片子归到同一次检查、同一个序列
    # 注：文本报告里的检查号会被换成占位符 <检查号>，而 DICOM 侧保留原值 ——
    #     两边口径不同是刻意的：DICOM 侧的检查号是研究方归集片子用的关联键，
    #     保留项与清空项都会进命中清单（附原因），伦理办点检时看得见「留了什么」。
    #     若贵院口径把检查号当直接标识（能在 RIS 反查到人），把 AccessionNumber
    #     从这里挪到 clear_tags 即可 —— 改配置，不必改代码。
    - AccessionNumber
    - SeriesNumber
    - InstanceNumber
    # 设备信息：厂商侧排障、机器参数核对时要用
    - Modality
    - Manufacturer
    - ManufacturerModelName
    - StationName
  clear_tags:
    # 患者身份（核心）
    - PatientName
    - PatientID
    - IssuerOfPatientID
    - PatientBirthDate
    - PatientSex
    - PatientAge
    - PatientSize
    - PatientWeight
    - PatientAddress
    - PatientTelephoneNumbers
    - EthnicGroup
    - PatientComments
    # 住院 / 申请关联（能反查患者）
    - AdmissionID
    - IssuerOfAdmissionID
    - CurrentPatientLocation
    - PatientInstitutionResidence
    # 人员与机构（虽非患者身份，但属可识别到人的信息）
    - ReferringPhysicianName
    - ReferringPhysicianAddress
    - RequestingPhysician
    - ScheduledPerformingPhysicianName
    - OperatorsName
    - InstitutionName
    - InstitutionAddress
  replace_tags: {}
  clear_private_tags: true
  default_action: keep
  mark_identity_removed: true
  deidentification_method: "ResearchRedact tag-level de-identification v1"

# ---------------------------------------------------------------------------
# 14. 残留自检分级口径
#
#     残留自检扫的是**脱敏产物**，要回答两个不同的问题：
#
#       阻断级（blocking）—— 产物里还留着患者身份吗？留着就不能交付。
#       提示级（hint）    —— 产物里还有没有「看着像编号、但并不是身份」的串？
#                            剂量、金额、页码、床号都长这样；把它们算成残留，
#                            真正的漏脱会被淹没（值班的人一眼看去全是
#                            「30mL、128.50、第 2 页」，反倒看不出姓名还留着）。
#
#     档位名沿用上面 conflicts.priority 那套分档：
#       identity   身份类（姓名 / 患者编号 / 身份证 / 手机号 / 出生日期）
#       encounter  就诊编号类（住院号 / 门诊号 / 检查号）
#       generic    通用数字类（其余类别）
#
#     unclassified_is_blocking：策略表里没分配档位的实体类别，默认按身份类
#     处理（宁可多拦一批，也不让「新增识别器的类别没登记」变成一条永远查不
#     出来的漏脱）。改成 false 即改为只提示 —— **按院区口径改**。
#
#     写错档位名、同一档位既阻断又提示 → 装载即报错，不静默取默认值。
# ---------------------------------------------------------------------------
residual:
  blocking_tiers:
    - identity
    - encounter
  hint_tiers:
    - generic
  unclassified_is_blocking: true
